<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <img id="imagem-form" src="assets/paisagem-de-natureza-roxa-bonita-com-montanhas_1302-6317.avif">        
        <h1 id="login-title" class="teste"><b> Login</b></h1>
        <p class="teste" id="cadastrar-texto">Não tem uma conta?</p>
        <button class="teste" id="cadastrar-button">Cadastre-se</button>
        <form action="#" method="post">
            <div id="name-area" >
                <label for="nome">Nome:</label>
                <br>
                <input type="text" name="nome" id="nome" >
            </div>
            <div id="email-area" >
                <label for="email">Email:</label>
                <br>
                <input type="email" name="email" id="email" >
            </div>
            <div id="password-area" >
                <label for="senha">Senha:</label>
                <br>
                <input type="password" name="senha" id="senha">
            </div>
            <a id="forgot-password" href="https://www.youtube.com/">Esqueceu a senha</a>
            <div id="buttom-area">
                <button type="reset" class="buttons-login"><b>Resetar</b></button>
                <button type="submit" class="buttons-login"><b>Submeter</b></button>
            </div>
        </form>        
    </div>
</body>
</html>
